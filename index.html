<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f0;
            --card: #ffffff;
            --text: #2d3436;
            --text-muted: #636e72;
            --border: #dfe6e9;
            --green: #00b894;
            --red: #e17055;
            --accent: #e17055;
            --accent-hover: #d63031;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--card);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background: var(--text);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 3px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            background: var(--bg);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: "SF Mono", Monaco, monospace;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .trend-up { color: var(--green); }
        .trend-down { color: var(--red); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 0.75rem 0.5rem;
            border-bottom: 2px solid var(--border);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(0,0,0,0.01);
        }

        .amount {
            font-family: "SF Mono", Monaco, monospace;
            font-weight: 600;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .status-complete {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .delete-btn {
            background: transparent;
            color: var(--red);
            border: 1px solid var(--border);
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            width: auto;
        }

        .delete-btn:hover {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        .legend {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .legend-line {
            width: 20px;
            height: 2px;
            display: inline-block;
        }

        .legend-line.up { background: var(--green); }
        .legend-line.down { background: var(--red); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sales Tracker</h1>
            <div class="subtitle">Track orders and spot trends</div>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalRevenue">$0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Orders</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="trendIndicator">-</div>
                <div class="stat-label">Trend</div>
            </div>
        </div>

        <div class="layout">
            <div class="sidebar">
                <div class="card">
                    <h2>New Order</h2>
                    <form id="orderForm">
                        <div class="form-group">
                            <label>Customer</label>
                            <input type="text" id="customer" required placeholder="Name">
                        </div>
                        <div class="form-group">
                            <label>Product</label>
                            <input type="text" id="product" required placeholder="Item">
                        </div>
                        <div class="form-group">
                            <label>Amount ($)</label>
                            <input type="number" id="amount" required min="0" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <button type="submit">Add Order</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Data</h2>
                    <button class="btn-secondary" onclick="exportData()">Export JSON</button>
                    <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Import</button>
                    <input type="file" id="importFile" style="display: none" accept=".json" onchange="importData(this)">
                </div>
            </div>

            <div class="main">
                <div class="card">
                    <h2>Revenue Trend</h2>
                    <div class="legend">
                        <div class="legend-item">
                            <span class="legend-line up"></span>
                            <span>Going up</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-line down"></span>
                            <span>Going down</span>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <h2>Orders</h2>
                    <div id="ordersList">
                        <div class="empty-state">No orders yet. Add one to get started.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        let chart;

        // Set today's date
        document.getElementById('date').valueAsDate = new Date();

        document.getElementById('orderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const order = {
                id: Date.now(),
                customer: document.getElementById('customer').value,
                product: document.getElementById('product').value,
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('date').value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            orders.push(order);
            saveOrders();
            updateUI();
            
            // Reset form
            document.getElementById('customer').value = '';
            document.getElementById('product').value = '';
            document.getElementById('amount').value = '';
            
            // Keep date as today for convenience
        });

        function saveOrders() {
            localStorage.setItem('orders', JSON.stringify(orders));
        }

        function toggleComplete(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.completed = !order.completed;
                saveOrders();
                updateUI();
            }
        }

        function deleteOrder(id) {
            if (confirm('Delete this order?')) {
                orders = orders.filter(o => o.id !== id);
                saveOrders();
                updateUI();
            }
        }

        function updateUI() {
            updateStats();
            updateChart();
            updateTable();
        }

        function updateStats() {
            const total = orders.reduce((sum, o) => sum + o.amount, 0);
            document.getElementById('totalRevenue').textContent = '$' + total.toFixed(2);
            document.getElementById('totalOrders').textContent = orders.length;
            
            // Calculate trend (comparing last order to previous)
            if (orders.length >= 2) {
                const last = orders[orders.length - 1].amount;
                const prev = orders[orders.length - 2].amount;
                const diff = last - prev;
                const pct = ((diff / prev) * 100).toFixed(1);
                
                if (diff > 0) {
                    document.getElementById('trendIndicator').innerHTML = `<span class="trend-up">↑ ${pct}%</span>`;
                } else if (diff < 0) {
                    document.getElementById('trendIndicator').innerHTML = `<span class="trend-down">↓ ${Math.abs(pct)}%</span>`;
                } else {
                    document.getElementById('trendIndicator').textContent = '= 0%';
                }
            } else {
                document.getElementById('trendIndicator').textContent = '-';
            }
        }

        function updateChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            if (orders.length === 0) {
                return;
            }

            // Sort by date
            const sorted = [...orders].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Create datasets showing individual order amounts
            // X axis: Order number (1, 2, 3...)
            // Y axis: Amount
            const labels = sorted.map((_, i) => `Order ${i + 1}`);
            const data = sorted.map(o => o.amount);

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Order Amount',
                        data: data,
                        borderWidth: 3,
                        pointRadius: 5,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#2d3436',
                        pointBorderWidth: 2,
                        tension: 0.1,
                        // Dynamic coloring: green when going up, red when down
                        segment: {
                            borderColor: ctx => {
                                const prev = ctx.p0.parsed.y;
                                const curr = ctx.p1.parsed.y;
                                if (curr > prev) return '#00b894'; // Green up
                                if (curr < prev) return '#e17055'; // Red down
                                return '#b2bec3'; // Gray flat
                            }
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const order = sorted[ctx.dataIndex];
                                    return `$${ctx.parsed.y.toFixed(2)} - ${order.product}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: (val) => '$' + val,
                                font: { family: 'monospace' }
                            },
                            grid: {
                                color: '#f0f0f0'
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        function updateTable() {
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state">No orders yet. Add one to get started.</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 30px">✓</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Product</th>
                            <th style="text-align: right">Amount</th>
                            <th style="width: 50px"></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Show most recent first
            [...orders].reverse().forEach(order => {
                const date = new Date(order.date).toLocaleDateString();
                const completedClass = order.completed ? 'status-complete' : '';
                
                html += `
                    <tr class="${completedClass}">
                        <td>
                            <input type="checkbox" 
                                   ${order.completed ? 'checked' : ''} 
                                   onchange="toggleComplete(${order.id})"
                                   title="Mark as completed">
                        </td>
                        <td>${date}</td>
                        <td>${escapeHtml(order.customer)}</td>
                        <td>${escapeHtml(order.product)}</td>
                        <td class="amount" style="text-align: right">$${order.amount.toFixed(2)}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteOrder(${order.id})">×</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function exportData() {
            const dataStr = JSON.stringify(orders, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orders-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        orders = imported;
                        saveOrders();
                        updateUI();
                    } else {
                        alert('Invalid file');
                    }
                } catch (err) {
                    alert('Error reading file');
                }
            };
            reader.readAsText(file);
        }

        // Initialize
        updateUI();
    </script>
</body>
</html>
